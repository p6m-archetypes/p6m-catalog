description: "P6M Service Archetypes"
authors: ["Jimmie Fulton <jimmie@ybor.ai>"]
tags: ["services", "platform"]

requires:
  archetect: "3.0.0"

# Sources are pinned to each archetype's `dev` branch (`#dev`) so the catalog
# serves the latest reviewed development version until we begin tagging releases,
# at which point each `#dev` ref is replaced with a pinned version tag.
# Authors with a local checkout under a configured `locals.paths` directory render
# from that checkout automatically; everyone else clones the pinned `dev` ref.

catalog:
  go:
    description: "Go"
    catalog:
      services:
        description: "Services"
        catalog:
          basic:
            description: "Go Basic Service"
            source: "git@github.com:p6m-archetypes/golang-service-basic-archetype.git#dev"
          empty:
            description: "Go Service Platform Overlay"
            source: "git@github.com:p6m-archetypes/golang-service-empty-archetype.git#dev"
          rest:
            description: "Go REST Service"
            source: "git@github.com:p6m-archetypes/golang-rest-service-archetype.git#dev"
          grpc:
            description: "Go gRPC Service"
            source: "git@github.com:p6m-archetypes/golang-grpc-service-archetype.git#dev"
          graphql:
            description: "Go GraphQL Service"
            source: "git@github.com:p6m-archetypes/golang-graphql-service-archetype.git#dev"

